# Starter + persistent disk is a paid configuration. Review cost before applying.
services:
  - type: web
    name: business-destiny
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build:node
    startCommand: npm run start:node
    healthCheckPath: /api/content
    disk:
      name: business-destiny-data
      mountPath: /var/data/business-destiny
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data/business-destiny
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_SALT
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
