# Free Render compute. Neon provides durable database and small-site image storage.
services:
  - type: web
    name: business-destiny
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:node
    startCommand: npm run start:node
    healthCheckPath: /api/content
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE_BACKEND
        value: neon
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_SALT
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
